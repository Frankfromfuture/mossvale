        location = /mossvale { return 302 /mossvale/; }
        location ^~ /mossvale/api/voice/ {
            proxy_pass http://127.0.0.1:8796/api/voice/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_connect_timeout 3s;
        }
        location ^~ /mossvale/ {
            client_max_body_size 16k;
            proxy_pass http://127.0.0.1:8796/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
            proxy_connect_timeout 3s;
        }

        location = /mystery { return 302 /mystery/$is_args$args; }
        location = /mystery/ {
            set $mossvale_migrated_cookie "";
            if ($cookie_mystery_sid ~ "^[a-f0-9]{32}$") {
                set $mossvale_migrated_cookie "mystery_sid=$cookie_mystery_sid; Path=/mossvale/; HttpOnly; Secure; SameSite=Strict; Max-Age=31536000";
            }
            add_header Set-Cookie $mossvale_migrated_cookie always;
            add_header Cache-Control "no-store" always;
            return 302 /mossvale/$is_args$args;
        }
        location ^~ /mystery/api/voice/ {
            proxy_pass http://127.0.0.1:8796/api/voice/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_connect_timeout 3s;
        }
        location ^~ /mystery/ {
            proxy_cookie_path /mossvale/ /mystery/;
            client_max_body_size 16k;
            proxy_pass http://127.0.0.1:8796/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
            proxy_connect_timeout 3s;
        }
